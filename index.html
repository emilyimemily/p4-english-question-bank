/* ============================================================
   12. Event delegation (single set of listeners on #app)
   ============================================================ */
function handleField(el){
  const f = el.dataset && el.dataset.field;
  if (!f) return;
  switch(f){
    case 'search':       state.filters.text = el.value; updateMatchCount(); break;
    case 'count': {
      const n = parseInt(el.value, 10);
      state.drawCount = (isNaN(n) || n < 1) ? 1 : n;
      break;
    }
    case 'student-answer': activeAnswers()[el.dataset.qid] = el.value; break;
    case 'vpart': {
      if (el.type === 'checkbox' && el.checked && el.dataset.group){
        Array.prototype.forEach.call(
          document.querySelectorAll('[data-group="'+el.dataset.group+'"]'),
          function(other){ if (other !== el) other.checked = false; });
      }
      syncVisual(el.dataset.qid);
      break;
    }
    case 'tick-option': {
      if (el.checked && el.dataset.group){
        Array.prototype.forEach.call(
          document.querySelectorAll('[data-group="'+el.dataset.group+'"]'),
          function(other){ if (other !== el) other.checked = false; });
        activeAnswers()[el.dataset.qid] = el.value;
      } else if (!el.checked && activeAnswers()[el.dataset.qid] === el.value){
        activeAnswers()[el.dataset.qid] = '';
      }
      break;
    }
    case 'filter': {
      const set = state.filters[el.dataset.dim];
      if (set){ if (el.checked) set.add(el.dataset.val); else set.delete(el.dataset.val); }
      const chip = el.closest('.chip');
      if (chip) chip.classList.toggle('on', el.checked);
      updateMatchCount();
      break;
    }
    case 'only-doubt':   state.filters.onlyDoubt = el.checked; updateMatchCount(); break;
    case 'wrong-mode':   state.filters.wrongMode = el.value; updateMatchCount(); break;
    case 'group-pick':   state.groupPick = parseInt(el.value, 10) || 0; break;
    case 'show-answers': state.showAnswers = el.checked; render(); break;
    case 'paper-goto':   gotoPaperQuestion(parseInt(el.value, 10)); break;
    case 'autoremove':   state.autoRemove = el.checked; break;
    case 'wb-sort':      state.wbSort = el.value; render(); break;
  }
}
function onInput(e){
  const f = e.target.dataset && e.target.dataset.field;
  if (!f) return;
  // These fire both input + change; handle them only once (on input) where possible.
  if (['filter','only-doubt','show-answers','autoremove','wb-sort','wrong-mode','paper-goto'].indexOf(f) !== -1) return;
  handleField(e.target);
}
function onChange(e){ if (e.target.dataset && e.target.dataset.field) handleField(e.target); }
function onClick(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action, qid = btn.dataset.qid;
  switch(a){
    case 'tab':            state.tab = btn.dataset.tab; render(); break;
    case 'clear-dim':      state.filters[btn.dataset.dim].clear(); render(); break;
    case 'reset-filters':  resetFilters(); render(); break;
    case 'gen-random':     genRandom(); break;
    case 'gen-all':        genAll(); break;
    case 'paper-prev':     gotoPaperQuestion(state.paperIndex - 1); break;
    case 'paper-next':     gotoPaperQuestion(state.paperIndex + 1); break;
    case 'paper-resume':   gotoPaperQuestion(paperResumeIndex()); break;
    case 'paper-submit':   submitPaperQuestion(); break;
    case 'paper-override-correct': overridePaperResult(qid, true); break;
    case 'paper-override-wrong':   overridePaperResult(qid, false); break;
    case 'paper-reset-scores': {
      state.paperAnswers = {}; state.paperResults = {}; state.paperVisualParts = {};
      state.paperCursor = 0; state.paperIndex = 0; state.paperFurthest = 0;
      render(); scrollPaperIntoView();
      break;
    }
    case 'toggle-answers': state.showAnswers = !state.showAnswers; render(); break;
    case 'print-paper':    updatePrintArea(); window.print(); break;
    case 'practice-paper': {
      const p = state.paper;
      if (!p || !p.questions || !p.questions.length){ flash('Please generate a paper first.'); break; }
      startPractice(p.questions, {label: p.title || 'Whole-paper practice'});
      break;
    }
    case 'export-json':    exportPaper(); break;
    case 'start-paper':    if (state.paper) startPractice(state.paper.questions, {label:'Current paper'}); break;
    case 'start-practice': startPracticeCustom(); break;
    case 'start-group':    startGroupPractice(); break;
    case 'student-back':   state.student.active = false; render(); break;
    case 'submit':         submitPractice(); break;
    case 'prev-question':  gotoQuestion(state.student.qIndex - 1); break;
    case 'next-question':  gotoQuestion(state.student.qIndex + 1); break;
    case 'resume-question':gotoQuestion(practiceResumeIndex()); break;
    case 'view-results': {
      const el = document.getElementById('practiceSummary');
      if (el && el.scrollIntoView){
        try{ el.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){ scrollTop(); }
      } else scrollTop();
      break;
    }
    case 'override-correct': overrideResult(qid, true); break;
    case 'override-wrong':   overrideResult(qid, false); break;
    case 'add-wrong':      addWrongFromResult(qid); break;
    case 'redo-all':       restartPractice(); break;
    case 'redo-wrong':     redoWrongOnly(); break;
    case 'wb-redo':        startWBRedo(qid); break;
    case 'wb-remove':      removeWrong(qid); render(); break;
    case 'wb-master':      masterWrong(qid); render(); break;
    case 'wb-print':       updatePrintArea(); window.print(); break;
    case 'clear-lines': {
      const hid = document.querySelector('input[data-part="_lines"][data-qid="'+qid+'"]');
      if (hid) hid.value = '[]';
      const p = activeVisualParts()[qid] || {}; p._lines = '[]'; activeVisualParts()[qid] = p;
      render();
      break;
    }
    case 'wb-clear':
      if (confirm('Clear the entire wrong book? This cannot be undone.')){ memWB = []; saveWB(); render(); }
      break;
  }
}

/* ============================================================
   13. Boot
   ============================================================ */
/* Freehand matching lines drawn directly on the scanned question */
let _drawStart = null;
function drawPoint(svg, e){
  const r = svg.getBoundingClientRect();
  return { x: 100 * (e.clientX - r.left) / (r.width || 1),
           y: 100 * (e.clientY - r.top) / (r.height || 1) };
}
function onPointerDown(e){
  if (!e || !e.target || !e.target.closest) return;
  const svg = e.target.closest('[data-role="draw-surface"]');
  if (!svg || typeof svg.getBoundingClientRect !== 'function') return;
  const p = drawPoint(svg, e);
  _drawStart = { svg: svg, qid: svg.dataset.qid, x: p.x, y: p.y };
}
function onPointerUp(e){
  if (!_drawStart || !e) return;
  const s = _drawStart; _drawStart = null;
  const p = drawPoint(s.svg, e);
  if (Math.abs(p.x - s.x) + Math.abs(p.y - s.y) < 2) return;
  const hid = document.querySelector('input[data-part="_lines"][data-qid="'+s.qid+'"]');
  let arr = [];
  try { arr = JSON.parse(hid ? hid.value : (visParts(s.qid)['_lines'] || '[]')); } catch(err) { arr = []; }
  arr.push([+s.x.toFixed(2), +s.y.toFixed(2), +p.x.toFixed(2), +p.y.toFixed(2)]);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
  line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
  if (s.svg.appendChild) s.svg.appendChild(line);
  if (hid){ hid.value = JSON.stringify(arr); syncVisual(s.qid); }
  else { const vp = activeVisualParts()[s.qid] || {}; vp._lines = JSON.stringify(arr); activeVisualParts()[s.qid] = vp; }
}

const APP = document.getElementById('app');
APP.addEventListener('click', onClick);
APP.addEventListener('input', onInput);
APP.addEventListener('change', onChange);
APP.addEventListener('pointerdown', onPointerDown);
APP.addEventListener('pointerup', onPointerUp);
/* on a phone the on-screen keyboard covers half the screen: when a box on a
   scan is tapped, bring it to the visible middle before typing starts */
APP.addEventListener('focusin', function(e){
  const el = e.target;
  if (!el || !el.classList || !el.classList.contains('shot-input')) return;
  try {
    el.scrollIntoView({block:'center', behavior:'smooth'});
  } catch(err){
    try { el.scrollIntoView(true); } catch(e2){}
  }
});

/* ============================================================
   14. Cloud boot, deep links and progress portability
   ============================================================ */
function applyDeepLink(){
  try{
    const p = new URLSearchParams(location.search);
    if (['teacher','student','wrongbook'].indexOf(p.get('tab')) >= 0) state.tab = p.get('tab');
    DIMS.forEach(d => p.getAll(d.key).forEach(v => state.filters[d.key].add(v)));
    if (p.has('text')) state.filters.text = p.get('text');
    if (p.has('doubt')) state.filters.onlyDoubt = p.get('doubt') !== '0';
    if (p.has('n')) state.drawCount = Math.max(1, Math.min(999, Number(p.get('n')) || 10));
  }catch(e){ /* ignore malformed query strings */ }
}
function exportProgress(){
  const payload = {
    format: 'p4-english-bank-progress', version: 1, exportedAt: new Date().toISOString(),
    wrongbook: loadWB(),
    settings: { autoRemove: state.autoRemove, wbSort: state.wbSort }
  };
  download('p4-bank-progress-'+todayStr()+'.json', JSON.stringify(payload, null, 2));
}
function importProgress(file){
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(String(r.result));
      if (!d || d.format !== 'p4-english-bank-progress' || !Array.isArray(d.wrongbook))
        throw new Error('Unrecognised progress file');
      memWB = d.wrongbook; saveWB();
      if (d.settings){
        if (typeof d.settings.autoRemove === 'boolean') state.autoRemove = d.settings.autoRemove;
        if (d.settings.wbSort) state.wbSort = d.settings.wbSort;
      }
      render();
      alert('Progress imported: '+d.wrongbook.length+' wrong-book entries.');
    }catch(err){ alert('Import failed: '+err.message); }
  };
  r.readAsText(file);
}
document.addEventListener('click', function(e){
  const t = (e.target && e.target.closest) ? e.target.closest('[data-action]') : null;
  if (!t) return;
  if (t.dataset.action === 'export-progress') exportProgress();
  if (t.dataset.action === 'import-progress'){
    const f = document.getElementById('progressFile');
    if (f) f.click();
  }
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'progressFile' && e.target.files && e.target.files[0])
    importProgress(e.target.files[0]);
});
async function boot(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="wrap"><div class="card empty-card">Loading question bank...<br><small>data/question_bank.json</small></div></div>';
  if (window.P4_EMBEDDED_BANK && location.protocol === 'file:'){
    BANK = window.P4_EMBEDDED_BANK;
  } else {
    try{
      /* 'no-cache' means "revalidate with the server before using a copy".
         'force-cache' was the opposite: it let the browser answer from its
         own HTTP cache without ever asking GitHub Pages, so a published
         fix (new answer boxes, removed word banks) could stay invisible
         for days.  The service worker still serves the cached copy when
         the network is unavailable. */
      const res = await fetch(BANK_DATA_URL, {cache:'no-cache'});
      if (!res.ok) throw new Error('HTTP '+res.status);
      BANK = await res.json();
      if (!BANK || !Array.isArray(BANK.questions)) throw new Error('Invalid question bank payload');
    }catch(err){
      if (window.P4_EMBEDDED_BANK){
        BANK = window.P4_EMBEDDED_BANK;
      } else {
        app.innerHTML = '<div class="wrap"><div class="card empty-card"><b>Could not load the question bank.</b><br>'+
          esc(String(err))+'<br><br>Open this page over HTTP(S) (for example the GitHub Pages URL) rather than directly from disk, '+
          'or use <a href="./offline.html">offline.html</a>, which has the data built in.<br><br>'+
          '<button class="btn primary" data-action="retry-load">Retry</button></div></div>';
        const btn = app.querySelector('[data-action="retry-load"]');
        if (btn) btn.addEventListener('click', boot);
        return;
      }
    }
  }
  _qmap = null;
  applyDeepLink();
  render();
}
boot();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  /* A returning visitor can still be controlled by an older cache-first
     worker.  Once the fresh worker takes over, reload ONCE so the new
     interface appears without asking the user to hard-refresh. */
  var hadController = !!navigator.serviceWorker.controller;
  var reloaded = false;
  try{ reloaded = sessionStorage.getItem('p3ebReloaded') === '1'; }catch(e){}
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || reloaded) return;
    reloaded = true;
    try{ sessionStorage.setItem('p3ebReloaded','1'); }catch(e){}
    try{ window.location.reload(); }catch(e){}
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(function(reg){
      reg.update();
    }).catch(function(){});
  });
}
</script>
