<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 English Question Bank · Paper Builder / Practice / Wrong Book</title>
<meta name="description" content="A free, offline-capable Primary 4 English past-year exam question bank with paper builder, practice, automatic marking and a wrong book.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<meta name="theme-color" content="#1F3A6E">
<style>
/* ===== Design tokens (light, education-friendly) ===== */
:root{
  --bg:#f7f8fa;          --card:#ffffff;        --text:#1f2329;       --muted:#6b7280;
  --border:#e5e7eb;      --border-soft:#eef0f4;
  --accent:#3b5bdb;      --accent-soft:#edf1ff; --accent-dark:#2f49b0;
  --red:#d92d20;         --red-soft:#fdeceb;    --green:#12a150;      --green-soft:#e7f7ee;
  --amber:#b7791f;       --amber-soft:#fff5e0;
  --radius:12px;         --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.35;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;font-weight:400}
.spacer{flex:1}
a{color:var(--accent)}

/* ===== Header + stats bar ===== */
.app-header{background:var(--card);border-bottom:1px solid var(--border)}
.head-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.brand h1{font-size:19px;letter-spacing:.3px}
.brand .sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--border-soft);border-radius:10px;padding:8px 14px;min-width:104px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* ===== Tabs ===== */
.tabs{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tabs-inner{display:flex;gap:6px}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:13px 22px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tab:hover{color:var(--accent)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}

/* ===== Layout + cards ===== */
.view{padding:22px 0 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:12px}
.empty-card{color:var(--muted);text-align:center;padding:44px 20px;line-height:1.9}
.sec-title{font-size:16px;margin:22px 0 12px}

/* ===== Buttons / toolbar ===== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);color:#fff}
.btn.ghost{background:var(--bg)}
.btn.danger,.btn.mini.danger{color:var(--red);border-color:#f3c6c2}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.mini{padding:4px 10px;font-size:12px;font-weight:600;border-radius:6px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 2px;text-decoration:underline;font-weight:600}
.linkbtn:disabled{color:var(--green);text-decoration:none;cursor:default}

/* ===== Filter panel ===== */
.filter-top{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:12px;background:var(--bg);border:1px solid var(--border-soft);border-radius:10px;margin-bottom:14px}
.filter-top .search{flex:1;min-width:230px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input[type="search"],input[type="number"],select,textarea,.answer-area,.num-input{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;color:var(--text)}
input[type="search"]:focus,select:focus,textarea:focus,.num-input:focus{border-color:var(--accent)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--accent);width:15px;height:15px}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.sel select{padding:6px 8px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fgroup{border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;background:#fff}
.fgroup-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--accent-soft);font-weight:600;font-size:13px;color:var(--accent-dark)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px;max-height:122px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;background:#fff;color:var(--muted);user-select:none}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.count-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-top:14px;margin-top:14px;border-top:1px dashed var(--border)}
#matchCount{color:var(--accent);font-size:18px;font-weight:700}
.num-input{width:88px;text-align:center}

/* ===== Generated paper ===== */
.paper-toolbar{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.paper-surface{background:#fff;border:1px solid var(--border-soft);border-radius:10px;padding:22px 26px}
.print-head{border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:18px}
.print-head h1{font-size:21px;color:var(--accent-dark)}
.print-head .ph-sub{color:var(--muted);font-size:12px;margin:6px 0 0}
.print-head .ph-line{margin-top:10px;font-size:13px}
.pq{padding:14px 0;border-bottom:1px dashed var(--border);break-inside:avoid;page-break-inside:avoid}
.pq:last-child{border-bottom:0}
.pq-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pq-head strong{color:var(--text);font-size:15px}
.src{color:var(--accent-dark);font-weight:600}
.marks{color:var(--muted)}
.stem{margin:8px 0;font-size:15px;white-space:pre-wrap}
.passage{margin:10px 0 6px;border:1px solid #e3e8f5;border-radius:8px;background:#f8faff;padding:8px 12px;font-size:13px;color:#39415a}
.passage summary{cursor:pointer;font-weight:600;color:#3b5bdb;list-style:none}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:'▾ ';font-size:11px}
.passage-body{margin-top:8px;line-height:1.75;white-space:pre-wrap;max-height:260px;overflow:auto}
.passage-scan{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.passage-scan .scan-label{font-size:12px;font-weight:600;color:#5b6480}
.passage-scan a{display:block}
.passage-scan img{display:block;width:100%;max-width:760px;border:1px solid #dfe5f2;border-radius:6px;background:#fff}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;margin:8px 0}
.opt-line{padding:4px 6px;border-radius:6px;font-size:14px}
.opt-line.correct-opt{background:var(--green-soft);color:var(--green);font-weight:600}
.opt-key{font-weight:700;margin-right:4px}
.ans-flag{font-size:11px;margin-left:6px}
.blank-lines{margin:10px 0;height:54px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--border) 25px,var(--border) 26px)}
.blank-label{font-size:12px;color:var(--muted);margin-top:8px}
.ans-block{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:10px;font-size:13px}
.ans-block p{margin:4px 0}
.hint-list{margin:6px 0;padding-left:20px;color:var(--muted)}
.pq-meta{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}
.pq-meta p{margin:4px 0}

/* ===== Image-first question rendering ===== */
.visual{margin:10px 0}
.visual-label{font-size:12px;font-weight:700;color:var(--accent-dark);margin:12px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.visual-label .tag{font-weight:500;color:var(--muted);font-size:11px}
.visual-note{font-size:12px;color:var(--muted);margin:6px 0}
.shot-wrap{position:relative;display:block;width:100%;max-width:900px;margin:8px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.shot-link{display:block}
.shot-open{display:inline-block;font-size:11px;color:var(--accent);margin:0 0 10px;text-decoration:underline}
.shot-img{display:block;width:100%;height:auto}
.shot-input{position:absolute;box-sizing:border-box;border:1.5px solid #2f5bd7;border-radius:4px;background:rgba(255,255,255,.96);color:#132a5e;font-size:13px;line-height:1.2;padding:1px 5px;min-width:26px;min-height:22px;box-shadow:0 0 0 2px rgba(47,91,215,.14);z-index:3}
.shot-input:focus{outline:2px solid #2f5bd7;background:#fff}
.shot-input-empty{background:transparent;border:1px dashed #7185bb;box-shadow:none;min-height:16px}
/* word box above a cloze passage - text, not part of the screenshot */
.word-bank{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;background:var(--bg);padding:10px 12px;margin:10px 0 6px;max-width:900px}
.wb-head{font-size:12px;font-weight:700;color:var(--accent-dark);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wb-head .tag{font-weight:500;color:var(--muted);font-size:11px}
.wb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px}
.wb-item{font-size:14px;color:#1d2b4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-item b{color:var(--accent-dark);font-weight:700;margin-right:2px}
.wb-word{font-family:ui-monospace,Menlo,Consolas,monospace}
.wb-note{font-size:11px;color:var(--muted);margin-top:8px}
.wb-warn{color:#8a5a00}
.wb-print{background:#fff;border-color:#888}
.visual-answer{margin-top:10px}
.visual-answer .answer-area{min-height:76px}
.vis-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.vis-table th,.vis-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:middle}
.vis-table th{background:var(--bg);font-weight:700}
.vis-table td.center,.vis-table th.center{text-align:center;width:92px}
.vis-table input[type="text"]{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.vis-table input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.draw-surface{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair;touch-action:none}
.draw-surface line{stroke:#d92d20;stroke-width:.4;stroke-linecap:round}
.draw-tools{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ===== Student practice form ===== */
.pract-head{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:14px}
.qcard-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qno{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.opt-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.opt{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);margin-top:4px}
.answer-area{width:100%;resize:vertical}
.end-bar{text-align:center}

/* ===== One-question-at-a-time online practice ===== */
.practice-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.practice-progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.practice-progress .pp-num{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.pp-track{width:180px;height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.pp-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.practice-bar{position:sticky;bottom:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.97);border:1px solid var(--border);border-bottom:0;
  border-radius:12px 12px 0 0;padding:10px 14px;margin-top:14px;
  box-shadow:0 -4px 18px rgba(16,24,40,.09)}
.practice-bar .bar-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.practice-bar .bar-note{font-size:12px;color:var(--muted);max-width:460px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.practice-bar .bar-note.has-result{color:var(--accent-dark);font-weight:700;white-space:normal}
.feedback-inline{margin-top:14px;border-left:4px solid var(--accent)}
.feedback-inline.is-bad{border-left-color:var(--red)}
.feedback-inline.is-ok{border-left-color:var(--green)}
.locked-note{background:var(--accent-soft);color:var(--accent-dark);border-radius:8px;
  padding:8px 12px;font-size:13px;margin-top:12px}
/* Paged Paper Builder preview: one big question (one article) per screen */
.pq-progress{margin:2px 0 12px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.pq-jump{margin-left:6px;font-size:12px;color:var(--muted)}
.pq-jump select{font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
.pq-nav{border-radius:12px}
.pq-nav .bar-note{flex:1 1 auto}
.paper-finished{margin:0 0 12px;padding:10px 14px;background:var(--green-soft);
  color:var(--green);border:1px solid var(--border);border-radius:10px;font-size:13px}
.paper-finished .btn{margin-left:10px}
.paper-toolbar .hint{font-size:12px}
/* two halves of one long passage crop read as a single continuous scan */
.visual > .shot-wrap + .shot-wrap{margin-top:0;border-top:0;border-top-left-radius:0;border-top-right-radius:0}
@media (max-width:680px){
  .practice-bar{padding:8px 10px;gap:6px}
  .practice-bar .btn{padding:9px 10px;font-size:13px;touch-action:manipulation}
  .practice-bar .bar-note{flex:1 1 100%;max-width:100%;white-space:normal;font-size:12px}
  .practice-bar .bar-right{flex:1 1 100%;justify-content:flex-end}
  .pp-track{width:110px}
}

/* ===== Feedback card ===== */
.status{font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.bad{background:var(--red-soft);color:var(--red)}
.status.part{background:var(--amber-soft);color:var(--amber)}
.ans-ref{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0;color:var(--muted)}
/* ===== Answer audit flags (shown at Reference answer) ===== */
.ans-audit{margin:8px 0 0;padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.55;
  border:1px solid var(--border-soft);background:var(--card);color:var(--text)}
.ans-audit.warn{background:var(--amber-soft);border-color:#f0d9a8;color:#7a4e08}
.ans-audit.fix{background:var(--accent-soft);border-color:#d9e2ff;color:var(--accent-dark)}
.ans-audit.ok{background:var(--green-soft);border-color:#c9ecd8;color:#0b6c38}
.ans-audit.mute{background:var(--bg);color:var(--muted)}
.ans-audit .audit-note{display:block;margin-top:4px}
.ans-audit .audit-ind{display:block;margin-top:5px;font-weight:700}
.ans-audit-chip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
  font-size:11px;font-weight:700;background:var(--amber-soft);color:#8a5a09}
/* ===== Vocabulary MCQ option meanings (English-English) ===== */
.gloss-block{margin:10px 0 0;padding:10px 12px;border-radius:8px;
  border:1px solid var(--border-soft);background:var(--card)}
.gloss-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.gloss-count{font-size:11px;font-weight:600;color:var(--muted);margin-left:6px}
.gloss-list{list-style:none;margin:0;padding:0}
.gloss-row{display:flex;flex-wrap:wrap;gap:3px 10px;padding:5px 0;
  border-top:1px solid var(--border-soft);font-size:12.5px;line-height:1.5}
.gloss-row:first-child{border-top:0}
.gloss-opt{flex:0 0 auto;min-width:150px;font-weight:700;color:var(--accent-dark);
  overflow-wrap:anywhere;word-break:break-word}
.gloss-def{flex:1 1 240px;color:var(--text);overflow-wrap:anywhere}
.gloss-row.is-missing .gloss-def{color:var(--muted);font-style:italic}
@media (max-width:680px){
  .gloss-opt{min-width:0;flex:1 1 100%;max-width:100%}
  .gloss-def{flex:1 1 100%;max-width:100%}
}
.fb-grid{margin-top:10px;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
.fb-row{display:flex;border-bottom:1px solid var(--border-soft)}
.fb-row:last-child{border-bottom:0}
.fb-label{flex:0 0 158px;background:var(--accent-soft);color:var(--accent-dark);font-weight:600;padding:10px 12px;font-size:13px}
.fb-body{flex:1;padding:10px 12px;font-size:13px}
.explain{margin-top:10px;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 12px}
.override{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft)}

/* ===== Summary / charts (pure CSS + inline SVG) ===== */
.sum-stats{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.sum-num{background:var(--bg);border:1px solid var(--border-soft);border-radius:10px;padding:10px 18px;min-width:130px}
.sum-num span{display:block;font-size:12px;color:var(--muted)}
.sum-num b{display:block;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.sum-num small{color:var(--muted)}
.chart-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:12px 0}
.dough{flex:0 0 auto}
.legend h3,.sum2 h3,.advice h3{font-size:13px;color:var(--muted);margin-bottom:8px}
.legend-list{list-style:none;padding:0;margin:0}
.legend-list li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}

/* ===== Wrong-book ===== */
.wb-toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.sum2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bar-label{flex:0 0 116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:16px;overflow:hidden;border:1px solid var(--border-soft)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#6b86f5);border-radius:6px}
.bar-num{flex:0 0 28px;text-align:right;font-weight:700;color:var(--accent)}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini-table{width:100%;border-collapse:collapse;font-size:12px}
.mini-table th,.mini-table td{border-bottom:1px solid var(--border-soft);padding:5px 6px;text-align:left}
.mini-table th{color:var(--muted);font-weight:600}
.advice{margin-top:14px;background:var(--green-soft);border-radius:10px;padding:10px 14px}
.advice h3{color:var(--green)}
.advice p{margin:0;font-size:13px}
.wb-group{margin-bottom:14px}
.wb-group-head{background:var(--accent-soft);color:var(--accent-dark);font-weight:700;padding:8px 14px;border-radius:8px;margin-bottom:8px}
.wb-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.wb-item-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.badge{background:var(--red-soft);color:var(--red);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
.badge.mastered{background:var(--green-soft);color:var(--green)}
.wb-meta{font-size:12px;color:var(--muted);margin:6px 0}
.wb-item .stem{font-size:14px;margin:6px 0}

/* ===== Footer / toast / print surface ===== */
.app-footer{border-top:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;padding:16px 0;margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.print-area{display:none}

/* ===== Responsive ===== */
@media (max-width:1000px){
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .opts,.opt-list{grid-template-columns:1fr}
  .sum2,.tables{grid-template-columns:1fr}
}
@media (max-width:680px){
  .fgrid{grid-template-columns:1fr}
  .fb-row{flex-direction:column}
  .fb-label{flex:auto}
  .head-inner{flex-direction:column;align-items:flex-start}
  .paper-surface{padding:16px}
  /* tabs scroll sideways instead of wrapping onto two cramped lines */
  .tabs-inner{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{padding:12px 14px;white-space:nowrap;flex:0 0 auto;touch-action:manipulation}
  /* answer boxes on the scan: big enough to tap, 16px stops iOS zoom-on-focus */
  .shot-input{min-height:28px;min-width:42px;font-size:16px;padding:1px 4px;touch-action:manipulation;
              background:rgba(255,255,255,.52)}
  .shot-input:focus{background:#fff;z-index:6}
  /* the mirrored "Your answer" row is the comfortable way to type on a phone */
  .vis-table input[type="text"]{font-size:16px;min-height:36px}
  .vis-table td.center,.vis-table th.center{width:64px}
  .vis-table input[type="checkbox"]{width:26px;height:26px}
  input[type="search"],input[type="number"],select,textarea,.answer-area,.num-input{font-size:16px}
  .btn{padding:10px 14px;touch-action:manipulation}
  .toolbar{gap:6px}
  .shot-wrap{max-width:100%}
}

/* ===== Dedicated print stylesheet: only the paper / wrong-book is printed ===== */
@media print{
  @page{size:A4;margin:16mm}                 /* margin suppresses browser header/footer */
  body{background:#fff;color:#000;font-size:12px}
  #app{display:none !important}             /* hide all application chrome */
  .toast{display:none !important}
  .no-print{display:none !important}
  .print-area{display:block !important}
  .print-doc{color:#000}
  .print-head{border-bottom:2px solid #333}
  .print-head h1{color:#000}
  .print-head .ph-sub{color:#444}
  .pq{break-inside:avoid;page-break-inside:avoid;border-bottom:1px solid #ddd}
  .src{color:#222}
  .ans-block{background:#f5f5f5;border-left-color:#333}
  .pq-meta{background:#fafafa}
  .opt-line.correct-opt{background:#eee;color:#000}
  .passage{background:#fff;border-color:#bbb;color:#222;break-inside:avoid}
  .passage summary{color:#222}
  .passage-body{max-height:none;overflow:visible;font-size:11px;line-height:1.5}
  .passage-scan .scan-label{color:#222;font-size:10px}
  .passage-scan img{max-height:8cm;object-fit:contain;object-position:top;border-color:#bbb}
  .blank-lines{background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#bbb 25px,#bbb 26px)}
  .visual-label{color:#222;font-size:10px}
  .visual-label .tag,.visual-note,.draw-tools{display:none}
  .shot-wrap{max-width:14cm;border-color:#bbb;break-inside:avoid;page-break-inside:avoid}
  .shot-input-empty{background:#fff;border:1px dashed #555}
  .vis-table th,.vis-table td{border-color:#888;padding:4px 6px;font-size:11px}
  .vis-table input[type="text"]{border:1px solid #888;min-height:20px}
  .draw-surface{display:none}
}
</style>
</head>
<body>
<!-- All on-screen app chrome lives here; hidden when printing -->
<div id="app"></div>
<!-- Populated with a clean, printable copy of the current document -->
<div id="printArea" class="print-area" aria-hidden="true"></div>

<script>
let BANK = null;
const BANK_DATA_URL = new URL('./data/question_bank.json', location.href).href;

/* ============================================================
   0. Small helpers — defensive against null / missing arrays
   ============================================================ */
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function allQuestions(){
  return (BANK && Array.isArray(BANK.questions)) ? BANK.questions.filter(q => q && typeof q === 'object') : [];
}
/* ============================================================
   0b. Image-first answering: scanned pages, on-image boxes,
       editable True/False tables and line-drawing for matching
   ============================================================ */
function vis(q){ return (q && q.visual && typeof q.visual === 'object') ? q.visual : null; }
function visList(q, which){
  const v = vis(q); if (!v) return [];
  const a = (which === 'article') ? v.article_images : v.question_images;
  return Array.isArray(a) ? a.filter(Boolean) : [];
}
function visParts(qid){
  const p = activeVisualParts()[qid];
  return (p && typeof p === 'object') ? p : {};
}
function syncVisual(qid){
  if (!qid) return;
  const nodes = document.querySelectorAll('[data-field="vpart"][data-qid="'+qid+'"]');
  const parts = {};
  Array.prototype.forEach.call(nodes, function(el){
    const part = el.dataset.part || ('p'+Object.keys(parts).length);
    let val = '';
    if (el.type === 'checkbox') val = el.checked ? (el.value || 'yes') : '';
    else val = String(el.value === null || el.value === undefined ? '' : el.value);
    const full = val ? (el.dataset.prefix || '') + val : '';
    if (full || !(part in parts)) parts[part] = full;
  });
  // every field that shares the same part (the box on the scan and its mirror
  // in the answer row) is kept in step with what the student typed
  Array.prototype.forEach.call(nodes, function(el){
    const part = el.dataset.part;
    if (!(part in parts)) return;
    if (el.type === 'checkbox'){
      el.checked = (parts[part] === (el.dataset.prefix || '') + (el.value || 'yes'));
      return;
    }
    if (document.activeElement === el) return;
    el.value = parts[part];
  });
  activeVisualParts()[qid] = parts;
  activeAnswers()[qid] = Object.keys(parts).sort(partSort)
    .filter(function(k){ return k.charAt(0) !== '_'; })
    .map(function(k){ return parts[k]; }).filter(Boolean).join(' ');
}
/* blank parts are named b1, b2, ... - they must sort numerically, not as text */
function partSort(a, b){
  const ra = /^([a-z]?)(\d+)$/.exec(a), rb = /^([a-z]?)(\d+)$/.exec(b);
  if (ra && rb){
    if (ra[1] !== rb[1]) return ra[1] < rb[1] ? -1 : 1;
    return parseInt(ra[2], 10) - parseInt(rb[2], 10);
  }
  return a < b ? -1 : (a > b ? 1 : 0);
}
function shotInputHtml(q, o, i, interactive){
  const st = 'left:'+Number(o.x||0)+'%;top:'+Number(o.y||0)+'%;width:'+Number(o.w||10)+'%;height:'+Number(o.h||4)+'%';
  const qid = o.owner || q.id;
  const part = o.part || ('o'+i);
  /* ONLY the hidden printable copy uses a decoration.  Every on-screen view
     gets a real, focusable text input - a dead <div> here was the reason
     students could not type on the scan at all. */
  if (interactive === 'print')
    return '<div class="shot-input shot-input-empty" style="'+st+'" title="'+esc(o.label||'')+'"></div>';
  /* grammar-cloze inline options: the bracket [ offer / offers ] carries the
     choices - show them as the input's placeholder so the student still sees the
     options while the box sits over the bracket. */
  const ph = o.opt_text ? ' placeholder="'+esc(o.opt_text)+'"' : '';
  return '<input class="shot-input" type="text" style="'+st+'" data-field="vpart" data-qid="'+esc(qid)+
         '" data-part="'+esc(part)+'" value="'+esc(visParts(qid)[part] || '')+'"'+
         ph+' aria-label="'+esc(o.label || 'Answer')+' answer box">';
}
/* the blanks that belong to THIS question (a cloze passage shows the blanks of
   the whole passage, but only the one of this question is this answer) */
function ownOverlays(q){
  const v = vis(q); if (!v) return [];
  return (v.overlays || []).filter(function(o){
    return o.own !== false && (!o.owner || o.owner === q.id);
  });
}
function visualImageHtml(q, which, interactive){
  const v = vis(q), imgs = visList(q, which);
  if (!v || !imgs.length) return '';
  const withBoxes = (v.overlay_on === which);
  /* Comprehension / Grammar / Vocabulary Cloze (and Editing) are answered ONLY
     in the boxes printed on the passage scan.  Nothing at all is added below
     that scan - no mirrored answer row and no "open full size" link. */
  const barePassage = which === 'question' && (v.mode === 'cloze' || v.mode === 'editing'
                                   || v.mode === 'synthesis');
  const sizes = (which === 'article') ? (v.article_wh || []) : (v.question_wh || []);
  let out = '';
  imgs.forEach(function(src, i){
    let boxes = '';
    if (withBoxes){
      (v.overlays || []).filter(function(o){ return Number(o.img || 0) === i; })
        .forEach(function(o, k){ boxes += shotInputHtml(q, o, k, interactive); });
    }
    let surface = '';
    if (withBoxes && v.lines && interactive !== 'print'){
      let svgLines = '';
      try {
        JSON.parse(visParts(q.id)['_lines'] || '[]').forEach(function(s){
          svgLines += '<line x1="'+s[0]+'" y1="'+s[1]+'" x2="'+s[2]+'" y2="'+s[3]+'"></line>';
        });
      } catch(e) {}
      surface = '<svg class="draw-surface" data-role="draw-surface" data-qid="'+esc(q.id)+
                '" viewBox="0 0 100 100" preserveAspectRatio="none">'+svgLines+'</svg>';
    }
    /* the scan keeps its proportions even before the picture has loaded, so
       the answer boxes are always sized and placed on the right blank */
    const dim = (sizes[i] && sizes[i][0] && sizes[i][1])
      ? ' style="aspect-ratio:'+sizes[i][0]+'/'+sizes[i][1]+'"' : '';
    /* A scan that carries answer boxes must NOT be a link: a tap that misses
       a box by a pixel used to open the picture in a new tab instead of
       letting the student type.  Full-size is offered below instead. */
    const pic = '<img class="shot-img" src="'+esc(src)+'" alt="Scanned question">';
    out += '<div class="shot-wrap"'+dim+'>'+
           (withBoxes ? pic
                      : '<a class="shot-link" href="'+esc(src)+'" target="_blank" rel="noopener">'+pic+'</a>')+
           boxes + surface + '</div>'+
           (withBoxes && !barePassage ? '<a class="shot-open" href="'+esc(src)+'" target="_blank" rel="noopener">Open this scan full size</a>' : '');
  });
  return out;
}
function visTableHtml(q, interactive){
  const v = vis(q), t = v && v.table;
  if (!t) return '';
  const rows = Array.isArray(t.rows) ? t.rows : [];
  const tick = t.input === 'tick';
  const parts = visParts(q.id);
  let h = '<table class="vis-table"><thead><tr><th>No.</th><th>Statement</th>'+
          '<th class="center">True</th><th class="center">False</th></tr></thead><tbody>';
  rows.forEach(function(r, i){
    const pre = r.no ? ('Q'+r.no+'=') : '';
    h += '<tr><td>'+esc(r.no || '')+'</td><td>'+esc(r.text || '')+'</td>';
    ['True','False'].forEach(function(word, j){
      const part = 'r'+i+'_'+j;
      if (tick){
        const on = parts[part] === (pre+word) ? ' checked' : '';
        h += '<td class="center"><input type="checkbox" data-field="vpart" data-qid="'+esc(q.id)+
             '" data-part="'+part+'" data-prefix="'+esc(pre)+'" data-group="'+esc(q.id+'_'+i)+
             '" value="'+word+'"'+on+(interactive === 'print' ? ' disabled' : '')+'></td>';
      } else {
        const raw = String(parts[part] || '');
        const val = raw.indexOf(pre) === 0 ? raw.slice(pre.length) : raw;
        h += '<td class="center"><input type="text" data-field="vpart" data-qid="'+esc(q.id)+
             '" data-part="'+part+'" data-prefix="'+esc(pre)+'" value="'+esc(val)+'"'+
             (interactive === 'print' ? ' disabled' : ' placeholder="T / F"')+'></td>';
      }
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}
/* Plain answer field for questions whose scan has NO printed box of its own. */
function plainAnswerHtml(q, ans, rows){
  return '<div class="visual-answer"><div class="blank-label">Your answer (write below the question)</div>'+
         '<textarea class="answer-area" rows="'+(rows || 3)+'" data-field="student-answer" data-qid="'+esc(q.id)+
         '" placeholder="Type your answer here...">'+esc(ans)+'</textarea></div>';
}
function visualAnswerHtml(q, interactive, ans){
  const v = vis(q); if (!v) return '';
  const mode = v.mode || 'reading';
  const own = ownOverlays(q);
  let h = '';
  if (v.table) h += visTableHtml(q, interactive);
  if (v.lines){
    h += '<div class="draw-tools"><span>Drag on the picture above to draw a connecting line.</span>'+
         '<button class="btn mini" type="button" data-action="clear-lines" data-qid="'+esc(q.id)+'">Clear lines</button>'+
         '<input type="hidden" data-field="vpart" data-qid="'+esc(q.id)+'" data-part="_lines" value="'+
         esc(visParts(q.id)['_lines'] || '[]')+'"></div>';
  }
  /* Cloze / editing / synthesis already have a real, focusable text box on
     every printed blank of the scan.  Nothing is rendered below the scan for
     these question types - not a mirrored answer row, not a fallback textarea. */
  if (own.length) return h;
  if (mode === 'cloze' || mode === 'editing') return h;
  /* An editable True/False or tick table is itself the answer input. */
  if (v.table) return h;
  if (hasOptions(q)) return h;
  return h + plainAnswerHtml(q, ans, mode === 'reading' ? 3 : 2);
}
/* A question that has no answer boxes still gets its OWN screenshot, cut out
   of the PDF, instead of a whole page that contains other question types. */
function qscanHtml(q){
  const imgs = (q && Array.isArray(q.qscan)) ? q.qscan.filter(Boolean) : [];
  if (!imgs.length) return '';
  const wh = q.qscan_wh || [];
  let h = '<div class="visual"><div class="visual-label">Question scan '+
          '<span class="tag">This question only - click to open full size</span></div>';
  imgs.forEach(function(src, i){
    const d = wh[i];
    const dim = (d && d[0] && d[1]) ? ' style="aspect-ratio:'+d[0]+'/'+d[1]+'"' : '';
    h += '<div class="shot-wrap"'+dim+'><a class="shot-link" href="'+esc(src)+'" '+
         'target="_blank" rel="noopener"><img class="shot-img" src="'+esc(src)+'" '+
         'alt="Scanned question"></a></div>';
  });
  return h + '</div>';
}
/* The printed reference word box is part of the SCAN, never OCR'ed into text.
   OCR of the box was unreliable (letters mis-read, words dropped), so the
   original printed box is shipped inside the screenshot instead. */
/* Every Reading Comprehension question is MARKED with the article it asks
   about.  The student is shown the article scan first and the cropped
   question straight after it, and the labels say which passage the question
   belongs to, so article and question can always be put back together. */
function passageMark(q){
  const idx = Number((q && q.passage_index) || 0);
  const pg  = Number((q && q.passage_page) || 0);
  const sec = (q && q.passage_section) ? String(q.passage_section).trim() : '';
  const no  = (q && q.no !== null && q.no !== undefined) ? String(q.no) : '';
  if (!idx && !sec && !pg){
    return {title:'Reading passage',
            tag:'Only the passage from the original paper - click to open full size',
            qtag:'This question only - cropped from the original paper', short:''};
  }
  const title = 'Reading passage ' + (idx || 1);
  const bits = [];
  if (sec) bits.push(sec);
  if (pg) bits.push('from page ' + pg);
  const tag = bits.join(' · ') + ' · from the original paper - tap to open full size';
  const qtag = 'Question ' + (no || '?') + ' belongs to ' + title.toLowerCase();
  return {title:title, tag:tag, qtag:qtag, short:'Passage ' + (idx || 1)};
}
function questionVisual(q, opts){
  const v = vis(q);
  if (!v) return qscanHtml(q);
  /* only the hidden printable copy is allowed to be non-interactive; every
     screen view (builder preview, practice, feedback, wrong book) is fillable */
  const printMode = !!(opts && opts.interactive === 'print');
  const interactive = printMode ? 'print' : true;
  const ans = (opts && opts.ans !== undefined && opts.ans !== null) ? String(opts.ans) : '';
  const arts = visList(q, 'article'), qs = visList(q, 'question');
  let h = '<div class="visual">';
  const pmark = passageMark(q);
  if (arts.length){
    h += '<div class="visual-label">'+esc(pmark.title)+
         ' <span class="tag">'+esc(pmark.tag)+'</span></div>';
    h += visualImageHtml(q, 'article', interactive);
  }
  if (qs.length){
    const passageMode = (v.mode === 'cloze' || v.mode === 'editing' || v.mode === 'synthesis');
    h += '<div class="visual-label">'+(passageMode ? 'Question / passage' : 'Question')+
         ' <span class="tag">'+(passageMode
            ? 'Type your answers in the boxes on the scan'
            : esc(pmark.qtag))+'</span></div>';
    h += visualImageHtml(q, 'question', interactive);
  }
  h += visualAnswerHtml(q, interactive, ans);
  return h + '</div>';
}
function stemHtml(q){ return vis(q) ? '' : '<p class="stem">'+esc(q.stem)+'</p>'; }

/* Reading passage / context for non-visual items (visual ones use the scan) */
function passageHtml(q){
  if (vis(q)) return '';
  const p = q && q.passage ? String(q.passage).trim() : '';
  const imgs = (q && Array.isArray(q.passage_images)) ? q.passage_images.filter(Boolean) : [];
  if (!p && !imgs.length) return '';
  const scan = imgs.length
    ? '<div class="passage-scan"><div class="scan-label">Original passage (scanned page - click to enlarge)</div>'+
      imgs.map(function(src){
        return '<a href="'+esc(src)+'" target="_blank" rel="noopener"><img src="'+esc(src)+'" alt="Original passage" loading="lazy"></a>';
      }).join('')+'</div>'
    : '';
  return '<details class="passage" open><summary>Reading Passage / Context</summary><div class="passage-body">'+esc(p)+'</div>'+scan+'</details>';
}
function papers(){
  return (BANK && Array.isArray(BANK.papers)) ? BANK.papers.filter(p => p && typeof p === 'object') : [];
}
let _qmap = null;                                   // lazy id -> question map
function questionById(id){
  if (!_qmap){
    _qmap = new Map();
    allQuestions().forEach(q => { if (q.id !== null && q.id !== undefined) _qmap.set(String(q.id), q); });
  }
  return _qmap.get(String(id)) || null;
}
function hasOptions(q){ return !!(q.options && typeof q.options === 'object' && Object.keys(q.options).length); }
function numMarks(q){ const n = Number(q && q.marks); return (isFinite(n) && n > 0) ? n : 1; }
/* ===== Vocabulary MCQ: an English definition for every option =====
   The glossary lives in data/question_bank.json under the top-level
   "glossary" key, so it is already loaded with BANK - no extra request and
   no service-worker change is needed. */
function glossKey(s){ return String(s === null || s === undefined ? '' : s).replace(/\s+/g,' ').trim().toLowerCase(); }
function isVocabMCQ(q){ return /vocabulary\s*mcq/i.test(String((q && q.type) || '')); }
function optionGlossaryHtml(q){
  if (!isVocabMCQ(q) || !hasOptions(q)) return '';
  const g = (BANK && BANK.glossary && typeof BANK.glossary === 'object') ? BANK.glossary : null;
  if (!g) return '';
  const keys = Object.keys(q.options).sort();
  if (!keys.length) return '';
  let rows = '', missing = 0;
  keys.forEach(function(k){
    const raw = String(q.options[k] === null || q.options[k] === undefined ? '' : q.options[k]);
    const entry = g[glossKey(raw)];
    let label = '(' + k + ') ' + raw, def = '';
    if (entry && typeof entry === 'object'){ label = '(' + k + ') ' + (entry.l || raw); def = String(entry.d || '').trim(); }
    else def = String(entry || '').trim();
    if (!def) missing++;
    rows += '<li class="gloss-row' + (def ? '' : ' is-missing') + '">' +
      '<span class="gloss-opt">' + esc(label) + '</span>' +
      '<span class="gloss-def">' + esc(def || 'Definition not available - this option has no readable word or phrase in the question bank (see the question scan).') + '</span></li>';
  });
  return '<div class="gloss-block"><div class="gloss-title">Option meanings - English definitions' +
    (missing ? ' <span class="gloss-count">' + missing + ' unavailable</span>' : '') +
    '</div><ul class="gloss-list">' + rows + '</ul></div>';
}
function sourceTag(q){
  const pm = passageMark(q);
  const s = [q.year, q.school, q.exam, (q.no !== null && q.no !== undefined) ? 'Q'+q.no : '',
             q.type, pm.short]
    .filter(x => x !== '' && x !== null && x !== undefined).join(' · ');
  const a = auditOf(q);
  return s + (q.doubt === true ? ' · ⚠ Needs Review' : '') +
    (a && a.status === 'questionable' ? ' · ⚠ Answer flagged' : '') +
    (a && (a.status === 'ai_solved' || a.status === 'ai_generated') ? ' · AI-written answer' : '');
}
function modelAnswer(q){
  const raw = String(q.answer === null || q.answer === undefined ? '' : q.answer);
  if (q.answer_text){
    const s = String(q.answer_text);
    // for MCQ also show the option number, e.g. "grateful(3)"
    if (hasOptions(q) && /^[1-4A-F]$/.test(raw) && s !== raw) return s + '(' + raw + ')';
    return s;
  }
  const a = raw;
  if (hasOptions(q)){
    const t = (q.options || {})[a];
    return t ? (t + '(' + a + ')') : a;
  }
  return a;
}
function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmtTime(ms){
  const s = Math.max(0, Math.floor((ms||0)/1000)), p = n => String(n).padStart(2,'0');
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return (h>0 ? p(h)+':' : '') + p(m)+':'+p(ss);
}
function fmtDate(ts){
  const d = new Date(ts || Date.now());
  if (isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function flash(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function download(filename, text){
  try{
    const blob = new Blob([text], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }catch(e){ /* download unsupported: fail quietly */ }
}

/* ============================================================
   2. Wrong-book persistence (localStorage + in-memory fallback)
   ============================================================ */
const WB_KEY = 'p3en_wrongbook_v1';
let memWB = null;             // used if localStorage throws (e.g. strict file://)
function loadWB(){
  if (memWB) return memWB;
  try{
    const raw = localStorage.getItem(WB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    memWB = Array.isArray(arr) ? arr : [];
  }catch(e){ memWB = []; }
  return memWB;
}
function saveWB(){
  try{ localStorage.setItem(WB_KEY, JSON.stringify(memWB || [])); }catch(e){ /* keep in memory only */ }
}
function addWrong(qid, answer, score){
  const wb = loadWB();
  const it = wb.find(x => x.qid === qid);
  if (it){
    it.wrongCount = (it.wrongCount || 0) + 1;
    it.lastAnswer = answer; it.lastScore = score; it.mastered = false;
  }else{
    wb.push({qid, addedAt: Date.now(), wrongCount:1, lastAnswer:answer, lastScore:score, mastered:false});
  }
  saveWB();
}
function removeWrong(qid){ memWB = loadWB().filter(x => x.qid !== qid); saveWB(); }
function masterWrong(qid){ const it = loadWB().find(x => x.qid === qid); if (it){ it.mastered = true; saveWB(); } }
// Keep an existing wrong-book entry in sync after any practice submission.
function syncWrongbookOnSubmit(q, ans, g){
  if (!loadWB().some(x => x.qid === q.id)) return;
  if (g.correct && state.autoRemove){ removeWrong(q.id); return; }
  const it = loadWB().find(x => x.qid === q.id);
  if (!it) return;
  it.lastAnswer = ans; it.lastScore = g.score;
  if (g.correct) it.mastered = true;
  else { it.wrongCount = (it.wrongCount || 0) + 1; it.mastered = false; }
  saveWB();
}

/* ============================================================
   3. Stats + dynamic filter options + matching
   ============================================================ */
function computeStats(){
  const qs = allQuestions(), pps = papers();
  const schools = new Set(), years = new Set();
  pps.forEach(p => { if (p.school) schools.add(p.school); if (p.year) years.add(p.year); });
  if (!schools.size) qs.forEach(q => { if (q.school) schools.add(q.school); });
  if (!years.size)   qs.forEach(q => { if (q.year) years.add(q.year); });
  const yl = [...years].sort((a,b) => Number(a)-Number(b));
  const yearStr = yl.length ? (yl.length===1 ? String(yl[0]) : yl[0]+'–'+yl[yl.length-1]) : '—';
  let attempted = 0, correct = 0;
  qs.forEach(q => {
    const v = q.verdict;
    if (v==='correct' || v==='wrong' || v==='doubt'){ attempted++; if (v==='correct') correct++; }
  });
  const acc = attempted ? (Math.round(correct/attempted*1000)/10)+'%' : '—';
  return {
    total: qs.length, schools: schools.size, yearStr, acc,
    papers: (BANK && BANK.meta && BANK.meta.papers) || 0,
    corpus: (BANK && BANK.meta && BANK.meta.corpus) || ''
  };
}
function distinctValues(key){
  const set = new Set();
  allQuestions().forEach(q => {
    const v = q[key];
    if (v !== null && v !== undefined && v !== '') set.add(String(v));
  });
  return [...set].sort((a,b) => {
    const na = Number(a), nb = Number(b);
    if (!isNaN(na) && !isNaN(nb) && String(na)===a.trim() && String(nb)===b.trim()) return na-nb;
    return String(a).localeCompare(String(b), 'en');
  });
}
function matchedQuestions(){
  const f = state.filters;
  return allQuestions().filter(q => {
    for (const d of DIMS){
      const set = f[d.key];
      if (set && set.size && !set.has(String(q[d.key] === null || q[d.key] === undefined ? '' : q[d.key]))) return false;
    }
    if (f.text.trim()){
      const hay = [q.stem, (Array.isArray(q.keywords)?q.keywords.join(' '):''), q.answer_text,
                   ...Object.values(q.options || {})].join(' ').toLowerCase();
      if (!hay.includes(f.text.trim().toLowerCase())) return false;
    }
    if (f.onlyDoubt && !(q.doubt === true || q.needs_review === true ||
        (auditOf(q) && auditOf(q).status === 'questionable'))) return false;
    if (f.wrongMode === 'exclude' && q.verdict === 'wrong') return false;
    return true;
  });
}
function updateMatchCount(){
  const el = document.getElementById('matchCount');
  if (el) el.textContent = matchedQuestions().length;
}

/* ============================================================
   5. Grading + feedback text
   ============================================================ */
function hasAnswerKey(q){
  const model = String(q.answer_text || q.answer || '').trim();
  const kws = Array.isArray(q.keywords) ? q.keywords.filter(k => String(k).trim()) : [];
  return !!(model || kws.length);
}
function referenceAnswerText(q){
  const a = String(modelAnswer(q) || '').trim();
  return a || 'Not available - no answer key was found in the original paper.';
}
/* Every key was checked against an independent attempt and against the paper's
   answer sheet.  Questionable / repaired keys are flagged right here, so the
   student can see both versions of the answer. */
function auditOf(q){
  return (q && q.answer_audit && typeof q.answer_audit === 'object') ? q.answer_audit : null;
}
function answerAuditHtml(q, compact){
  const a = auditOf(q);
  if (!a) return '';
  const st = String(a.status || '');
  const note = String(a.note || '').trim();
  const mine = String(a.independent || '').trim();
  const src  = String(a.source || '').trim();
  if (st === 'questionable'){
    if (compact)
      return '<span class="ans-audit-chip" title="'+esc(note)+'">&#9888; Questionable</span>';
    return '<div class="ans-audit warn"><b>&#9888; Questionable answer - check both versions</b>'+
      (note ? '<span class="audit-note">'+esc(note)+'</span>' : '')+
      (mine ? '<span class="audit-ind">Independent answer: '+esc(mine)+'</span>' : '')+
      (src  ? '<span class="audit-note">Source: '+esc(src)+'</span>' : '')+
      '<span class="audit-note">Both the paper\'s key and the independent answer are accepted when marking.</span>'+
      '</div>';
  }
  if (st === 'ocr_fixed'){
    if (compact) return '<span class="ans-audit-chip" style="background:var(--accent-soft);color:var(--accent-dark)" '+
      'title="'+esc(note)+'">&#9998; OCR-corrected</span>';
    return '<div class="ans-audit fix"><b>&#9998; OCR-corrected key</b>'+
      (note ? '<span class="audit-note">'+esc(note)+'</span>' : '')+
      '<span class="audit-note">Original answer-sheet text: '+esc(String(a.official || ''))+'</span></div>';
  }
  if (st === 'ai_solved' || st === 'ai_generated'){
    if (compact) return '<span class="ans-audit-chip" style="background:var(--accent-soft);color:var(--accent-dark)" '+
      'title="'+esc(note)+'">AI-written answer</span>';
    return '<div class="ans-audit fix"><b>AI-written answer - NOT from the PDF answer key</b>'+
      '<span class="audit-note">'+esc(note || 'This answer was worked out by the AI assistant because the original paper has no answer key for this item. It is not taken from the scanned answer sheet.')+'</span>'+
      (src ? '<span class="audit-note">Source: '+esc(src)+'</span>' : '')+
      '<span class="audit-note">Please verify it with a teacher or parent before relying on the score.</span></div>';
  }
  if (compact) return '';
  if (st === 'verified')
    return '<div class="ans-audit ok"><b>&#10003; Independently checked</b>'+
      '<span class="audit-note">Our own attempt matched the answer on the original paper.</span></div>';
  if (st === 'unverifiable')
    return '<div class="ans-audit mute"><b>&#9678; Independent check inconclusive</b>'+
      '<span class="audit-note">'+esc(note || 'The scan text is incomplete; verify against the source scan.')+'</span></div>';
  if (st === 'no_key')
    return '<div class="ans-audit mute"><b>&#9678; No official answer key</b>'+
      '<span class="audit-note">The original paper has no answer key for this item, so it is not auto-marked.</span></div>';
  return '';
}
function referenceAnswerHtml(q, compact){
  return esc(referenceAnswerText(q)) + answerAuditHtml(q, compact);
}
/* A keyword may now hold alternatives, e.g. "costs | prices".  The audit
   adds these so a student whose correct answer differs from the paper's key
   is not failed.  Each group counts as one mark / one scoring point. */
function kwGroups(q){
  const kws = Array.isArray(q.keywords) ? q.keywords.filter(k => String(k).trim()) : [];
  return kws.map(function(k){
    return String(k).split(/[|\/]/).map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean);
  });
}
function gradeQuestion(q, answer, parts){
  const marks = numMarks(q);
  const ans = (answer === null || answer === undefined) ? '' : String(answer);
  /* A few past-year papers do not contain an answer section.  Never pretend
     such an item is wrong: let the student / teacher self-mark it instead. */
  if (!hasAnswerKey(q)) return { score:0, correct:false, unmarked:true };
  if (hasOptions(q)){
    const key = ans.trim(), correctKey = String(q.answer === null || q.answer === undefined ? '' : q.answer).trim();
    let correct = key !== '' && key === correctKey;
    if (!correct && key){
      const optText = String((q.options || {})[correctKey] || '').trim().toLowerCase();
      if (optText && key.toLowerCase() === optText) correct = true;
    }
    return { score: correct ? marks : 0, correct };
  }
  // Open-ended: keyword-based partial scoring.
  const groups = kwGroups(q);
  const kws = groups.map(function(g){ return g.join(' | '); });
  const text = ans.toLowerCase().trim();
  if (text === '') return { score:0, correct:false };
  const v = vis(q);
  const vmode = v ? String(v.mode || '') : '';
  /* Cloze / editing / synthesis: one mark for each blank on the scan.  Compare
     the box values with the official answers position by position, so a
     passage with three blanks really gives Score 2 / 3 rather than 0 or all. */
  const vals = parts ? Object.keys(parts).sort(partSort)
      .filter(function(k){ return k.charAt(0) !== '_'; })
      .map(function(k){ return String(parts[k] || '').trim(); })
      .filter(Boolean) : [];
  if (v && (vmode === 'cloze' || vmode === 'editing' || vmode === 'synthesis')
      && vals.length > 1 && kws.length > 1){
    let hit = 0;
    vals.forEach(function(mine, i){
      const alts = groups[i] || [];
      if (!alts.length) return;
      const m = mine.toLowerCase().trim();
      if (alts.some(function(a){
        return m === a || (a.length > 2 && (m.indexOf(a) !== -1 || a.indexOf(m) !== -1));
      })) hit++;
    });
    const score = Math.min(marks, Math.round(marks * hit / vals.length));
    return { score:score, correct:(hit >= vals.length), perBlank:true };
  }
  if (vmode === 'truefalse' || vmode === 'tick'){
    const model = String(q.answer_text || q.answer || '').trim().toLowerCase();
    if (model === 'true' || model === 'false' || model === 't' || model === 'f'){
      const word = model === 't' ? 'true' : model === 'f' ? 'false' : model;
      const mine = text.split(/\s+/).filter(function(s){
        return s.indexOf('q' + String(q.no).toLowerCase() + '=') === 0;
      }).join(' ');
      const hit = (mine || text).indexOf(word) !== -1;
      return { score: hit ? marks : 0, correct: hit };
    }
  }
  if (kws.length){
    const hits = groups.filter(function(g){
      return g.some(function(k){ return text.indexOf(k) !== -1; });
    }).length;
    if (hits === kws.length) return { score:marks, correct:true };
    if (hits >= 1)           return { score:Math.ceil(marks/2), correct:false };
    return { score:0, correct:false };
  }
  const model = String(q.answer_text || q.answer || '').trim().toLowerCase();
  const correct = text !== '' && text === model;
  return { score: correct ? marks : 0, correct };
}
function wrongWhy(q, ans){
  const isMCQ = hasOptions(q), model = modelAnswer(q);
  const a = (ans === null || ans === undefined) ? '' : String(ans);
  if (isMCQ){
    const key = a.trim();
    const chosen = key ? ((q.options || {})[key] || key) : '(no answer)';
    const wh = q.wrong_hints;
    const hint = (wh && typeof wh === 'object' && wh[key]) ? wh[key] : null;
    if (hint) return 'You chose "'+chosen+'": '+hint;
    return 'You chose "'+chosen+'"; the correct answer is "'+model+'". '+chosen+
           ' does not fit this context. Use the context of the stem to check word meaning and collocation before answering.';
  }
  const text = a.trim();
  const kws = Array.isArray(q.keywords) ? q.keywords.filter(k => String(k).trim()) : [];
  if (kws.length)
    return 'Your answer "'+(text || '(no answer)')+'" does not cover all scoring key words ('+kws.join(', ')+
           '); the reference answer is "'+model+'". Check the explanation and add the missing key words.';
  return 'Your answer "'+(text || '(no answer)')+'" versus reference answer "'+model+
         '" does not match. Check the key words and sentence structure.';
}

/* ============================================================
   6. Charts (pure CSS bars + inline SVG doughnut, no library)
   ============================================================ */
function barChart(entries){
  const max = Math.max(1, ...entries.map(e => e[1]));
  return entries.map(([k,v]) =>
    '<div class="bar-row"><div class="bar-label" title="'+esc(k)+'">'+esc(k)+'</div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+(v/max*100).toFixed(1)+'%"></div></div>'+
    '<div class="bar-num">'+v+'</div></div>').join('');
}
function doughnutSVG(counts){
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const total = entries.reduce((s,e) => s+e[1], 0);
  const r = 46, c = 2*Math.PI*r;
  if (total === 0){
    return '<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="No wrong answers this time">'+
      '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#e5e7eb" stroke-width="16"/>'+
      '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#12a150" stroke-width="16"/>'+
      '<text x="60" y="66" text-anchor="middle" font-size="14" fill="#12a150">All correct</text></svg>';
  }
  let acc = 0;
  const segs = entries.map((e,i) => {
    const len = e[1]/total*c;
    const s = '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+DOUGH_COLORS[i%DOUGH_COLORS.length]+
      '" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+
      '" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    acc += len; return s;
  }).join('');
  return '<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="Wrong answers by question type">'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#eef0f4" stroke-width="16"/>'+segs+
    '<text x="60" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2329">'+total+'</text>'+
    '<text x="60" y="79" text-anchor="middle" font-size="9" fill="#6b7280">Wrong</text></svg>';
}
function doughnutLegend(counts){
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (!entries.length) return '';
  return '<ul class="legend-list">'+entries.map((e,i) =>
    '<li><span class="dot" style="background:'+DOUGH_COLORS[i%DOUGH_COLORS.length]+'"></span>'+
    esc(e[0])+' <b>'+e[1]+'</b> items</li>').join('')+'</ul>';
}

/* ============================================================

function buildFilterPanel(){
  const f = state.filters;

    const chips = vals.map(v => {

    }).join('');
    return '<div class="fgroup"><div class="fgroup-head"><span>'+d.label+'</span>'+
      '<button type="button" class="btn mini" data-action="clear-dim" data-dim="'+d.key+
      '" aria-label="Clear '+d.label+' filters">Clear</button></div>'+
      '<div class="chips">'+(chips || '<span class="muted">(none)</span>')+'</div></div>';
  }).join('');
  const top = '<div class="filter-top">'+
    '<label class="search">Keyword search (stem / keywords / options)'+
      '<input type="search" data-field="search" value="'+esc(f.text)+'" placeholder="Search a word or keyword..."></label>'+
    '<label class="ck"><input type="checkbox" data-field="only-doubt" '+(f.onlyDoubt?'checked':'')+'> Needs review only</label>'+

      '<select data-field="wrong-mode">'+

function makePaper(questions){
  return { title:'P4 English Generated Paper · '+todayStr(), date:todayStr(), generatedAt:Date.now(), questions:questions.slice() };
}
function resetPaperPaging(){
  state.paperIndex = 0;
  state.paperFurthest = 0;
  state.paperAnswers = {};
  state.paperResults = {};
  state.paperVisualParts = {};
  state.paperCursor = 0;
}
/* "Current progress": the furthest page visited, or the first page that has
   not been submitted yet - whichever is later. */
function paperResumeIndex(){
  const qs = (state.paper && state.paper.questions) || [];
  if (!qs.length) return 0;
  return Math.min(qs.length - 1, Math.max(state.paperFurthest || 0, state.paperCursor || 0));
}
function paperScore(){
  const qs = (state.paper && state.paper.questions) || [];
  let score = 0, marks = 0, submitted = 0, unmarked = 0;
  qs.forEach(function(q){
    marks += numMarks(q);
    const r = state.paperResults[q.id];
    if (r){ submitted++; score += r.score; if (r.unmarked && !r.overridden) unmarked++; }
  });
  return {score, marks, submitted, unmarked, total:qs.length};
}
function submitPaperQuestion(){
  const qs = (state.paper && state.paper.questions) || [];
  const q = qs[state.paperIndex];
  if (!q || state.paperResults[q.id]) return;
  const ans = state.paperAnswers[q.id] === undefined ? '' : state.paperAnswers[q.id];
  const g = gradeQuestion(q, ans, state.paperVisualParts[q.id]);
  state.paperResults[q.id] = {score:g.score, correct:g.correct, unmarked:!!g.unmarked, answer:ans};
  syncWrongbookOnSubmit(q, ans, g);
  let cursor = 0;
  while (cursor < qs.length && state.paperResults[qs[cursor].id]) cursor++;
  state.paperCursor = cursor;
  render();
  scrollToEl('paperFeedback');
}
function overridePaperResult(qid, isCorrect){
  const q = questionById(qid);
  if (!q || !state.paperResults[qid]) return;
  const r = state.paperResults[qid];
  r.score = isCorrect ? numMarks(q) : 0;
  r.correct = isCorrect; r.unmarked = false; r.overridden = true;
  render();
}
/* Immediate feedback card - shown only after this page's Submit was pressed. */
function paperFeedback(q){
  const r = state.paperResults[q.id] || {score:0, correct:false, unmarked:true};
  const ans = r.answer === undefined ? '' : r.answer;
  const marks = numMarks(q);
  const unmarked = !!r.unmarked && !r.overridden;
  const ok = r.score >= marks;
  const status = unmarked ? '<span class="status part">Needs teacher checking</span>'
               : ok ? '<span class="status ok">Correct</span>'
               : (r.score <= 0 ? '<span class="status bad">Incorrect</span>'
                               : '<span class="status part">Partial marks</span>');
  const scoreText = unmarked ? 'Not auto-marked · '+r.score+' / '+marks
                             : 'Score '+r.score+' / '+marks;
  const why = unmarked
    ? 'The original paper has no answer key for this item, so it cannot be marked automatically. '+
      'Check it with your teacher, then use the self-correction buttons below to record your score.'
    : (ok ? 'Well done - you have secured this mark.' : wrongWhy(q, ans));
  return '<section class="card feedback-inline '+(ok?'is-ok':'is-bad')+'" id="paperFeedback">'+
    '<div class="qcard-head"><b>Result</b> '+status+
      ' <span class="marks">'+esc(scoreText)+'</span></div>'+
    '<div class="ans-ref"><b>Reference answer: </b>'+referenceAnswerHtml(q, false)+
      ' <b>Your answer: </b>'+esc(String(ans) || '(no answer)')+'</div>'+
    optionGlossaryHtml(q)+
    '<div class="explain"><b>Why / what to revise: </b>'+esc(why)+'</div>'+
    '<div class="explain"><b>Explanation: </b>'+esc(q.explanation || '—')+'</div>'+
    (unmarked ? '<div class="override"><span class="muted">Self-correction:</span>'+
      '<button class="btn mini" data-action="paper-override-correct" data-qid="'+esc(q.id)+'">I was right</button>'+
      '<button class="btn mini" data-action="paper-override-wrong" data-qid="'+esc(q.id)+'">I was wrong</button>'+

function submitPractice(){

function practiceSummary(){
  const s = state.student;

  const wrongByType = {};
  s.questions.forEach(q => {
    const marks = numMarks(q), r = s.results[q.id] || {score:0, correct:false};
    totalScore += r.score; totalMarks += marks;
    if (r.correct) correctCount++;
    else { const t = q.type || 'Other'; wrongByType[t] = (wrongByType[t]||0)+1; }
  });

    totalScore, totalMarks, correctCount, total:s.questions.length, wrongByType,

  };

/* ---- P4: grouped practice ----
   A selection (e.g. one question type) is split into fixed groups of
   GROUP_SIZE questions.  The student picks a group from a dropdown; which
   groups are already done is remembered per filter combination, and the
   next not-yet-done group is offered by default so they never restart
   from the first item. */
const GROUP_KEY = 'p4en_groups_v1';
const GROUP_SIZE = 20;
function filterSignature(){
  const f = state.filters;
  const parts = [];
  DIMS.forEach(function(d){
    if (f[d.key] && f[d.key].size) parts.push(d.key+':'+[...f[d.key]].sort().join(','));
  });
  if (f.onlyDoubt) parts.push('doubt:1');
  if (f.wrongMode && f.wrongMode !== 'include') parts.push('wrong:'+f.wrongMode);
  return parts.join('|') || 'ALL';
}
function loadGroupProgress(){
  try{ const raw = localStorage.getItem(GROUP_KEY); const o = raw ? JSON.parse(raw) : {}; return (o && typeof o==='object') ? o : {}; }
  catch(e){ return {}; }
}
function saveGroupProgress(o){ try{ localStorage.setItem(GROUP_KEY, JSON.stringify(o)); }catch(e){} }
function markGroupDone(sig, g){
  const o = loadGroupProgress();
  const rec = o[sig] || {done:[], last:0};
  if (rec.done.indexOf(g) === -1) rec.done.push(g);
  rec.last = g;
  o[sig] = rec;
  saveGroupProgress(o);
}
function suggestedGroup(total, sig){
  const g = Math.max(1, Math.ceil(total / GROUP_SIZE));
  const done = new Set((loadGroupProgress()[sig] || {done:[]}).done || []);
  for (let i=1; i<=g; i++){ if (!done.has(i)) return i; }
  return g; /* all done -> re-do the last group */
}
function groupLabel(){
  const f = state.filters;
  const types = (f.type && f.type.size) ? [...f.type].join('/') : 'All types';
  const schools = (f.school && f.school.size) ? [...f.school].join('/') : '';
  return (schools ? schools+' - ' : '') + types;
}
function groupPracticePanel(){
  const total = matchedQuestions().length;
  if (!total) return '';
  const groups = Math.ceil(total / GROUP_SIZE);
  const sig = filterSignature();
  const done = new Set((loadGroupProgress()[sig] || {done:[]}).done || []);
  const suggested = suggestedGroup(total, sig);
  const current = state.groupPick || suggested;
  let opts = '';
  for (let i=1; i<=groups; i++){
    const a = (i-1)*GROUP_SIZE + 1, b = Math.min(total, i*GROUP_SIZE);
    const cnt = b - a + 1;
    const tick = done.has(i) ? ' (done)' : '';
    const sel = (i === current) ? ' selected' : '';
    opts += '<option value="'+i+'"'+sel+'>Group '+i+' - Q'+a+'-'+b+' ('+cnt+')'+tick+'</option>';
  }
  let hint = '';
  if (done.size){
    const lst = [...done].sort(function(x,y){return x-y;}).join(', ');
    hint = 'Completed groups: '+lst+'. ';
  }
  hint += 'Suggested next: Group '+suggested+'.';
  return '<div class="grp-panel">'+
    '<div class="grp-head">Practice by group <span class="hint">- this selection is split into groups of '+GROUP_SIZE+'; your progress is remembered</span></div>'+
    '<label class="sel">Choose a group: <select data-field="group-pick">'+opts+'</select></label>'+
    '<div class="grp-hint">'+esc(hint)+'</div>'+
  '</div>';
}
function startGroupPractice(){
  const pool = matchedQuestions();
  if (!pool.length){ flash('No questions match the current filters.'); return; }
  const groups = Math.ceil(pool.length / GROUP_SIZE);
  let g = state.groupPick || suggestedGroup(pool.length, filterSignature());
  if (g < 1) g = 1; if (g > groups) g = groups;
  const slice = pool.slice((g-1)*GROUP_SIZE, (g-1)*GROUP_SIZE + GROUP_SIZE);
  if (!slice.length){ flash('That group is empty.'); return; }
  const sig = filterSignature();
  startPractice(slice, {label: 'Group '+g+' - '+groupLabel()});
  state.student.groupKey = sig;
  state.student.groupIndex = g;
}

/* ONE big question (one passage) per screen.  The bottom-right button is
   Submit until the question is graded, then Next / View results. */
function renderPracticePage(){
  const s = state.student, n = s.questions.length;
  if (!n) return '<div class="wrap"><div class="card empty-card">No questions in this practice.</div></div>';
  const i = Math.max(0, Math.min(n - 1, s.qIndex));
  s.qIndex = i;
  const q = s.questions[i];
  const graded = gradedQuestion(q);
  const ans = s.answers[q.id] === undefined ? '' : s.answers[q.id];
  const resume = practiceResumeIndex();
  const reviewing = (i !== resume) && !s.submitted;
  const pct = Math.round(s.cursor / n * 100);

  const input = hasOptions(q)
    ? renderRadioOptions(q, i, ans)
    : (vis(q) ? '' : '<textarea class="answer-area" rows="3" placeholder="Type your answer here..." '+
        'data-field="student-answer" data-qid="'+esc(q.id)+'">'+esc(ans)+'</textarea>');

  const card = '<section class="qcard" id="practiceQuestion">'+
    '<div class="qcard-head"><span class="qno">'+(i+1)+'</span> '+
      '<span class="src">'+esc(sourceTag(q))+'</span> '+
      '<span class="marks">('+numMarks(q)+' marks)</span> '+
      (graded ? '<span class="status ok">Submitted</span>'
              : '<span class="status part">Not submitted</span>')+'</div>'+
    passageHtml(q)+questionVisual(q,{interactive:true, ans:ans})+stemHtml(q)+input+
    (graded ? '<div class="locked-note">This question is submitted. Use Previous to review an '+
              'earlier question, or continue to the next one.</div>' : '')+
  '</section>';

  const head = '<div class="card pract-head">'+
    '<div class="practice-progress">'+
      '<b>'+esc(s.label)+'</b>'+
      '<span class="pp-num">Question '+(i+1)+' of '+n+'</span>'+
      '<span class="pp-track"><span class="pp-fill" style="width:'+pct+'%"></span></span>'+
      '<span class="muted">'+s.cursor+' / '+n+' submitted</span>'+
      '<span>Time <span id="liveTimer" class="timer">'+
        fmtTime(s.submitted ? s.elapsed : (Date.now()-s.startTime))+'</span></span>'+
    '</div>'+
    '<div class="toolbar">'+
      (s.submitted ? '<button class="btn ghost" data-action="view-results">View results</button>' : '')+
      '<button class="btn ghost" data-action="student-back">Exit practice</button>'+
    '</div>'+
  '</div>';

  let left = '<button class="btn ghost" data-action="prev-question"'+(i===0?' disabled':'')+
             '>Previous question</button>';
  if (reviewing)
    left += '<button class="btn ghost" data-action="resume-question">Back to Question '+(resume+1)+'</button>';
  let right;
  if (!graded){
    right = '<button class="btn primary" data-action="submit">Submit answer</button>';
  } else if (i < n-1){
    right = '<button class="btn primary" data-action="next-question">Next question</button>';
  } else if (s.submitted){
    right = '<button class="btn primary" data-action="view-results">View results</button>';
  } else {
    right = '<button class="btn primary" data-action="resume-question">Back to Question '+(resume+1)+'</button>';
  }
  const rr = s.results[q.id];
  const note = graded
    ? '<span class="bar-note has-result">Score '+rr.score+' / '+numMarks(q)+
      ' · Reference answer: '+referenceAnswerHtml(q, true)+'</span>'
    : '<span class="bar-note">Answer on the scan, then press Submit to see the score and answer.</span>';
  const bar = '<div class="practice-bar">'+
    '<div class="toolbar">'+left+'</div>'+
    note+
    '<div class="bar-right">'+right+'</div>'+
  '</div>';

  return '<div class="wrap">'+ head +
    (s.submitted ? practiceSummaryCard() : '') +
    card + (graded ? practiceFeedback(q) : '') + bar +
  '</div>';
}
function renderStudent(){
  if (allQuestions().length === 0)
    return '<div class="wrap"><div class="card empty-card">Question bank not loaded.<br>'+
           'The data file data/question_bank.json could not be read. '+
           'Check your connection and refresh to start.</div></div>';

function wrongbookStats(wb){
  const byTopic = {}, byType = {}; let mastered = 0;
  wb.forEach(it => {
    if (it.mastered) mastered++;
    const q = questionById(it.qid);
    if (!q) return;
    const t = q.topic || 'Uncategorised', ty = q.type || 'Uncategorised';
    byTopic[t] = (byTopic[t]||0)+1; byType[ty] = (byType[ty]||0)+1;
  });
  return { byTopic, byType, mastered, total:wb.length };
}
function reviewAdvice(st){
  if (!st.total) return 'Your wrong book is empty. Complete a practice session, add the items you got wrong, and review advice will appear here automatically.';
  const top = Object.entries(st.byTopic).sort((a,b) => b[1]-a[1]).slice(0,3).map(e => e[0]);
  const tt = Object.entries(st.byType).sort((a,b) => b[1]-a[1])[0];
  let s = 'Total: '+st.total+' wrong items'+(st.mastered ? ' (of which '+st.mastered+' are marked as mastered)' : '')+
          '. Prioritise these topics: '+(top.join(', ') || 'high-frequency topics')+'; ';
  if (tt) s += 'By question type, "'+tt[0]+'" accounts for the most lost marks ('+tt[1]+' items); consider targeted practice on this type. ';
  s += 'Redo 3-5 wrong items daily, mark them "Mastered" once correct, or enable "Auto-remove on correct answer" to trim the list.';
  return s;
}
function renderWBSummary(st){
  const top5 = Object.entries(st.byTopic).sort((a,b) => b[1]-a[1]).slice(0,5);

function groupKeyOf(it, q, key){
  switch(key){
    case 'topic': return (q && q.topic) || 'Uncategorised';
    case 'type':  return (q && q.type)  || 'Uncategorised';
    case 'year':  return (q && q.year) ? String(q.year)+' ' : 'Unknown year';
    case 'addedAt': return fmtDate(it.addedAt) + ' Add';
    default: return 'All';
  }
}
function wbItem(it, q){
  if (!q)
    return '<div class="wb-item"><div class="wb-meta">Item '+esc(it.qid)+'(no longer in the question bank)</div>'+
      '<button class="btn mini danger" data-action="wb-remove" data-qid="'+esc(it.qid)+'">Remove</button></div>';
  const last = (it.lastAnswer === undefined || it.lastAnswer === null || it.lastAnswer === '') ? '(not recorded)' : String(it.lastAnswer);
  return '<div class="wb-item">'+
    '<div class="wb-item-top"><span class="src">'+esc(sourceTag(q))+'</span>'+
      (it.mastered?'<span class="badge mastered">Mastered</span>':'')+

    passageHtml(q)+questionVisual(q,{interactive:true})+stemHtml(q)+
    '<div class="wb-meta">Last answer: '+esc(last)+' · Last score: '+(it.lastScore===undefined?0:it.lastScore)+'/'+numMarks(q)+
      ' · Added: '+esc(fmtDate(it.addedAt))+'</div>'+
    '<div class="toolbar">'+
      '<button class="btn mini" data-action="wb-redo" data-qid="'+esc(q.id)+'">Redo</button>'+
      '<button class="btn mini" data-action="wb-master" data-qid="'+esc(q.id)+'">Mark Mastered</button>'+
      '<button class="btn mini danger" data-action="wb-remove" data-qid="'+esc(q.id)+'">Remove</button>'+
    '</div>'+

function renderWBList(wb){
  if (!wb.length)
    return '<div class="card empty-card">Your wrong book is empty.<br>After a practice session, click "Add to Wrong Book" in the item feedback.</div>';
  const groups = new Map();
  wb.forEach(it => {
    const key = groupKeyOf(it, questionById(it.qid), state.wbSort);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({it, q:questionById(it.qid)});
  });
  let keys = [...groups.keys()];
  if (state.wbSort === 'year' || state.wbSort === 'addedAt') keys.sort().reverse();
  else keys.sort((a,b) => String(a).localeCompare(String(b), 'en'));
  return keys.map(k => {
    const items = groups.get(k).sort((a,b) => (b.it.wrongCount||0)-(a.it.wrongCount||0));
    return '<div class="wb-group"><div class="wb-group-head">'+esc(k)+
      ' <span class="muted">('+items.length+' items)</span></div>'+
      items.map(x => wbItem(x.it, x.q)).join('')+'</div>';
  }).join('');
}

/* Once a question has been graded its answers are frozen, but still visible. */
function lockPracticeInputs(){
  const s = state.student;
  if (state.tab !== 'student' || !s.active) return;
  const q = s.questions[s.qIndex];
  if (!q || !s.results[q.id]) return;
  const card = document.getElementById('practiceQuestion');
  if (!card || !card.querySelectorAll) return;
  Array.prototype.forEach.call(card.querySelectorAll('input, textarea, .draw-surface'), function(el){
    const tag = el.tagName;
    if (tag === 'INPUT'){
      if (el.type === 'radio' || el.type === 'checkbox') el.disabled = true;
      else if (el.type === 'text') el.readOnly = true;
    } else if (tag === 'TEXTAREA'){
      el.readOnly = true;
    } else if (el.style){
      el.style.pointerEvents = 'none';
    }
  });
}
/* Once a page of the generated paper has been submitted its answers are
   frozen (still visible), so the score always matches what was submitted. */
function lockPaperInputs(){
  if (state.tab !== 'teacher' || !state.paper) return;
  const qs = state.paper.questions || [];
  const q = qs[state.paperIndex];
  if (!q || !state.paperResults[q.id]) return;
  const card = document.getElementById('paperQuestion');
  if (!card || !card.querySelectorAll) return;

      else el.readOnly = true;

      el.readOnly = true;
    } else if (el.style){
      el.style.pointerEvents = 'none';
    }
  });
}
